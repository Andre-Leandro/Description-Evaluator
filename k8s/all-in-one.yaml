# ============================================
# NAMESPACE
# ============================================
apiVersion: v1
kind: Namespace
metadata:
  name: description-evaluator
  labels:
    name: description-evaluator
    app: description-evaluator

---
# ============================================
# CONFIGMAPS
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: description-evaluator
data:
  redis.conf: |
    maxmemory 256mb
    maxmemory-policy allkeys-lru

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: description-evaluator
data:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  OTEL_SERVICE_NAME: "description-evaluator-backend"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: description-evaluator
data:
  NEXT_PUBLIC_API_URL: "http://localhost:8080/api"

---
# ============================================
# SECRETS - IMPORTANTE: CREAR MANUALMENTE
# ============================================
# NOTA: Por seguridad, el Secret 'backend-secrets' NO se incluye en este archivo.
# Debes crearlo manualmente usando el script create-secrets.sh
# 
# Para crear el Secret desde el archivo .env, ejecuta:
#   cd k8s
#   ./create-secrets.sh
#
# O créalo manualmente con kubectl:
#   kubectl create secret generic backend-secrets -n description-evaluator \
#     --from-literal=DB_USER="${POSTGRES_USER}" \
#     --from-literal=DB_PASSWORD="${POSTGRES_PASSWORD}" \
#     --from-literal=DB_HOST="${POSTGRES_HOST}" \
#     --from-literal=DB_PORT="${POSTGRES_PORT}" \
#     --from-literal=DB_NAME="${POSTGRES_DB}" \
#     --from-literal=REDIS_PASSWORD=""
#

---
# ============================================
# REDIS DEPLOYMENT
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: description-evaluator
  labels:
    app: redis
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: redis-config
          mountPath: /usr/local/etc/redis/redis.conf
          subPath: redis.conf
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: redis-config
        configMap:
          name: redis-config

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: description-evaluator
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: redis

---
# ============================================
# BACKEND DEPLOYMENT
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: description-evaluator
  labels:
    app: backend
    tier: application
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: backend
        tier: application
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - backend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: backend
        image: devopsregistrytp.azurecr.io/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 10000
          name: flask
        - containerPort: 8000
          name: metrics
        env:
        - name: user
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: DB_USER
        - name: password
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: DB_PASSWORD
        - name: host
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: DB_HOST
        - name: port
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: DB_PORT
        - name: dbname
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: DB_NAME
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: REDIS_PASSWORD
        - name: OTEL_SERVICE_NAME
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: OTEL_SERVICE_NAME
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 10000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 10000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: description-evaluator
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
  - port: 10000
    targetPort: 10000
    protocol: TCP
    name: flask
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: metrics
  selector:
    app: backend

---
# ============================================
# FRONTEND DEPLOYMENT
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: description-evaluator
  labels:
    app: frontend
    tier: presentation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
        tier: presentation
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - frontend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: frontend
        image: devopsregistrytp.azurecr.io/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: NEXT_PUBLIC_API_URL
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: description-evaluator
  labels:
    app: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: frontend

---
# ============================================
# INGRESS
# ============================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: description-evaluator-ingress
  namespace: description-evaluator
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80

---
# ============================================
# HORIZONTAL POD AUTOSCALERS
# ============================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: description-evaluator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: description-evaluator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75

---
# ============================================
# POD DISRUPTION BUDGETS
# ============================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: description-evaluator
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: backend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: description-evaluator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
