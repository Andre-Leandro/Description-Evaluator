apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-pod-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-pod-reader-binding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backend-pod-reader
subjects:
  - kind: ServiceAccount
    name: backend
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: default
  labels:
    app: backend
spec:
  replicas: 2 # High Availability: 2 pods distributed across different nodes
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "10000"
    spec:
      serviceAccountName: backend
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - backend
              topologyKey: kubernetes.io/hostname
      containers:
        - name: backend
          image: devopsregistrytp.azurecr.io/backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 10000
              name: http
          env:
            # Database connection (Supabase/PostgreSQL)
            - name: user
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: user
                  optional: true
            - name: password
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: password
                  optional: true
            - name: host
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: host
                  optional: true
            - name: port
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: port
                  optional: true
            - name: dbname
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: dbname
                  optional: true
            # Redis connection
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: redis_password
                  optional: true
            # OpenTelemetry configuration
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "backend-service"
            - name: ENVIRONMENT
              value: "kubernetes"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi" # Limit for OOMKilled testing
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 10000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 10000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: default
  labels:
    app: backend
spec:
  type: NodePort
  ports:
    - port: 10000
      targetPort: 10000
      nodePort: 30100
      name: http
  selector:
    app: backend
---
# Optional: Create secret for database credentials
# This secret contains placeholder values for local development.
# For production, create the secret with actual values:
#
# kubectl create secret generic backend-secrets \
#   --from-literal=db_user=your_user \
#   --from-literal=db_password=your_password \
#   --from-literal=db_host=your_host \
#   --from-literal=db_port=5432 \
#   --from-literal=db_name=your_db \
#   --from-literal=redis_password=your_redis_password
#
# NOTE: Empty values are placeholders. The backend will work without
# database credentials if Supabase is not configured, but will show
# errors when attempting to access database features.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: default
  annotations:
    description: "Placeholder secret for local development. Replace with actual values in production."
type: Opaque
data:
  # Base64 encoded placeholder values - replace with actual values
  # echo -n "value" | base64
  db_user: ""
  db_password: ""
  db_host: ""
  db_port: "NTQzMg=="
  db_name: ""
  redis_password: ""
