name: Backend Test (DevOps)

on:
  push:
    branches: [ DevOps ]
  pull_request:
    branches: [ DevOps ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests

      - name: Crear .env dummy
        run: |
          echo "user=postgres" > .env
          echo "password=admin" >> .env
          echo "host=localhost" >> .env
          echo "portdb=5432" >> .env
          echo "dbname=evaluador_db" >> .env

      - name: Run backend in background
        run: |
          python main.py & 
          sleep 10

      - name: Run backend tests
        run: pytest test_api.py
        

  start_deploy_render:
    name: Iniciar el despligue en Render
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/DevOps' && success()
    steps:
      - name: Desplegar en Render
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.render.com/deploy/srv-d2hrs9je5dus73e37jeg?key=JS1m1dH6B6c")
          if [ $response -eq 200 ]; then
            echo "Deployment successful"
          else
            echo "Deployment failed with HTTP status code $response"
            exit 1
          fi
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

  deploy_in_process:
    name: Despliegue en proceso
    runs-on: ubuntu-latest
    needs: start_deploy_render
    if: github.event_name == 'push' && github.ref == 'refs/heads/DevOps' && success()
    steps:
      - name: Despliegue en proceso
        run:  |
          deploy_status="pending"
          while [ "$deploy_status" != "live" ]; do
            response=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/srv-d2hrs9je5dus73e37jeg?key=JS1m1dH6B6c/deploys")
            echo "Render API response: $response"
            deploy_status=$(echo $response | jq -r '.[0].deploy.status') 
            echo "Current deploy status: $deploy_status"
            if [ "$deploy_status" == "failed" ]; then
              echo "Deployment failed."
              exit 1
            fi
            sleep 5
          done
          echo "Deployment completed successfully."
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}