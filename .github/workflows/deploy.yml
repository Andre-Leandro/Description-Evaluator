name: Build, Push and Deploy to Azure

on:
  push:
    branches: ["docker"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Login en ACR
      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: devopsregistrytp.azurecr.io
          username: devopsregistrytp
          password: R4vrzbA7fAuzv8L1jcFqIEorWmW/DnPUEh2bzet+95+ACRDKleJv

      - name: Export environment variables
        run: |
          echo "user=${{ secrets.DB_USER }}" >> $GITHUB_ENV
          echo "password=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "host=${{ secrets.DB_HOST }}" >> $GITHUB_ENV
          echo "port=${{ secrets.DB_PORT }}" >> $GITHUB_ENV
          echo "dbname=${{ secrets.DB_NAME }}" >> $GITHUB_ENV
          echo "REDIS_HOST=redis-17428.c56.east-us.azure.redns.redis-cloud.com" >> $GITHUB_ENV
          echo "REDIS_PORT=17428" >> $GITHUB_ENV
          echo "REDIS_PASSWORD=iqaLW1kalNrUmpx7LdlQA0RQ1bVpIeYe" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_API_URL=http://20.120.45.12:10000" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_URL=https://illglqdcmfjqktkyxhhh.supabase.co" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_GvcxsZEZvkvsrDj6qhlbkw_2Gb8sFF6" >> $GITHUB_ENV

      - name: Build & Push images using Docker Compose
        run: |
          docker compose build
          docker tag backend devopsregistrytp.azurecr.io/backend:latest
          docker tag frontend devopsregistrytp.azurecr.io/frontend:latest
          docker push devopsregistrytp.azurecr.io/backend:latest
          docker push devopsregistrytp.azurecr.io/frontend:latest

      - name: Azure CLI login
        run: |
          az login -u "${{ secrets.AZURE_USERNAME }}" -p "${{ secrets.AZURE_PASSWORD }}"

      - name: Deploy Backend
        run: |
          az container delete --resource-group tp-devops --name backend --yes || true
          az container create \
            --resource-group tp-devops \
            --name backend \
            --image devopsregistrytp.azurecr.io/backend:latest \
            --cpu 1 --memory 1 \
            --ports 10000 \
            --environment-variables \
              user=${user} \
              password=${password} \
              host=${host} \
              port=${port} \
              dbname=${dbname} \
              REDIS_HOST=${REDIS_HOST} \
              REDIS_PORT=${REDIS_PORT} \
              REDIS_PASSWORD=${REDIS_PASSWORD}

      - name: Deploy Frontend
        run: |
          az container delete --resource-group tp-devops --name frontend --yes || true
          az container create \
            --resource-group tp-devops \
            --name frontend \
            --image devopsregistrytp.azurecr.io/frontend:latest \
            --cpu 1 --memory 1 \
            --ports 3000 \
            --environment-variables \
              NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL} \
              NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL} \
              NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
